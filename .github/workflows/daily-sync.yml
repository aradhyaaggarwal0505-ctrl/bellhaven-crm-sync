name: daily-bellhaven-sync

on:
  schedule:
    - cron: "0 11 * * *"      # 06:00 US Eastern (11:00 UTC), daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency: bellhaven-sync   # never two runs writing the queue at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scrape, match, queue proposals
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}   # optional Slack webhook
        run: python run_pipeline.py --quiet
      - name: Open a review issue when something new was queued
        # A queue nobody looks at is worth nothing, so every run that finds new work pings a human.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(python -c "import json;print(json.load(open('state/last_run.json'))['queue']['new'])")
          if [ "$NEW" -gt 0 ]; then
            BODY=$(python -c "import json;d=json.load(open('state/last_run.json'));print('\n'.join('- '+t for t in d['new_titles']))")
            gh issue create --title "Review $NEW new CRM proposal(s) - $(date -u +%F)" \
              --body "Run the review app locally (\`python review_app/app.py\`) and decide these:\n\n$BODY"
          fi
      - name: Persist the review queue
        # The queue (state/proposals.db) is the source of truth for what has already been
        # decided, so it is committed back. Reviewers pull, review locally, and push.
        run: |
          git config user.name "bellhaven-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/proposals.db
          git diff --cached --quiet || git commit -m "daily sync: refresh proposal queue"
          git push
